apiVersion: apps/v1
kind: Deployment

metadata:
  name: chaos-monkey

spec:
  replicas: 1

  selector:
    matchLabels:
      app: chaos-monkey

  template:
    metadata:
      labels:
        app: chaos-monkey

    spec:
      serviceAccountName: chaosmonkey

      containers:
        - name: chaos-monkey
          image: chaos-monkey:latest
          imagePullPolicy: IfNotPresent

          env:
            - name: CHAOS_NAMESPACE
              value: "default"

            - name: CHAOS_INTERVAL
              value: "60"

            - name: CHAOS_MIN_ALIVE
              value: "1"
